name: Sync Posts to Blog Repository

on:
  push:
    branches: [ main ]
    paths:
      - '_posts/**'
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout source repository (blog_automate)
      uses: actions/checkout@v4
      with:
        path: source
        
    - name: Checkout target repository (blog.pandango.de)
      uses: actions/checkout@v4
      with:
        repository: lxndrJ/blog.pandango.de
        token: ${{ secrets.BLOG_SYNC_TOKEN }}
        path: target
        
    - name: Sync _posts folder
      run: |
        echo "Starting synchronization of _posts folder..."
        
        # Create _posts directory in target if it doesn't exist
        mkdir -p target/_posts
        
        # Sync files from source to target using rsync
        # --delete ensures deleted files are removed from target
        # --exclude-from ensures we don't sync unwanted files
        rsync -av --delete \
          --exclude='*.tmp' \
          --exclude='*.swp' \
          --exclude='.DS_Store' \
          source/_posts/ target/_posts/
        
        echo "Synchronization completed"
        
    - name: Check for changes in target repository
      id: check_changes
      run: |
        cd target
        if git diff --quiet && git diff --cached --quiet; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected in target repository"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in target repository"
        fi
        
    - name: Commit and push changes to target repository
      if: steps.check_changes.outputs.changes == 'true'
      run: |
        cd target
        
        # Configure git user
        git config --local user.email "action@github.com"
        git config --local user.name "Blog Sync Action"
        
        # Add all changes
        git add _posts/
        
        # Create commit message with timestamp
        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S UTC')
        git commit -m "Sync _posts from blog_automate repository - $TIMESTAMP"
        
        # Push changes
        git push
        
        echo "Changes successfully pushed to blog.pandango.de repository"
        
    - name: Summary
      run: |
        if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
          echo "✅ Successfully synchronized _posts folder to blog.pandango.de"
        else
          echo "ℹ️ No changes to synchronize"
        fi