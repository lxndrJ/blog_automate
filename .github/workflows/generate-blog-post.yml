# Previous version of generate-blog-post.yml

# Workflow to generate blog post
name: Generate Blog Post

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Generate blog post
        run: |
          echo 'Generating blog post...'

      - name: Commit blog post
        run: |
          git config --local user.email 'you@example.com'
          git config --local user.name 'Your Name'
          git add .
          git commit -m 'Add generated blog post' || echo 'Nothing to commit'
          git push
