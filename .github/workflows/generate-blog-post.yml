name: Generate Blog Post

on:
  schedule:
    # 6:00 UTC = 8:00 MESZ / 9:00 MEZ
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Freies Thema (optional)"
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BLOG_SITE_REPO: ${{ github.workspace }}/site
      BLOG_BOT_NAME: "lxndrJ[bot]"
      BLOG_BOT_EMAIL: "actions@github.com"

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout site repository (blog.pandango.de)
        uses: actions/checkout@v4
        with:
          repository: lxndrJ/blog.pandango.de
          token: ${{ secrets.BLOG_SYNC_TOKEN }}
          path: site
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate post → publish to site → archive locally
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          # Der Orchestrator:
          #  1) erzeugt den Post (eindeutiger Timestamp mit Berlin-Zone)
          #  2) kopiert ihn ins Site-Repo, committet & pusht nach blog.pandango.de
          #  3) verschiebt ihn im Pipeline-Repo nach archive/ (keine doppelte Pflege)
          if [ -n "$TOPIC" ]; then
            python orchestrator.py --topic "$TOPIC" --site-repo "$BLOG_SITE_REPO"
          else
            python orchestrator.py --site-repo "$BLOG_SITE_REPO"
          fi

      - name: Push pipeline repo (Archiv + Log)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "$BLOG_BOT_NAME"
          git config user.email "$BLOG_BOT_EMAIL"
          git add -A _posts archive run_log.jsonl history.json
          if git diff --cached --quiet; then
            echo "ℹ️ Pipeline-Repo ohne Änderungen"
          else
            git commit -m "Archive + Log: $(date +%F) (veröffentlicht auf blog.pandango.de)"
            git push origin main
            echo "✅ Pipeline-Repo aktualisiert (Post archiviert)"
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "## Blog Post Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date) |" >> $GITHUB_STEP_SUMMARY
          echo "| Flow | Generieren → Site-Repo pushen → Pipeline-Repo archivieren |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "archive" ]; then
            echo "| Archived posts | $(find archive -name '*.md' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Blog Post Generation FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          exit 1
