name: Generate Blog Posts (Daily ×3)

on:
  # schedule:
  #   # 6:00 UTC = 8:00 MESZ / 9:00 MEZ
  #   - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modus: daily (3 Posts) oder single (1 Post)"
        required: false
        default: "daily"
      topic:
        description: "Freies Thema (nur für single-Modus)"
        required: false
      category:
        description: "Kategorie (nur für single-Modus)"
        required: false
        default: "Reise"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BLOG_SITE_REPO: ${{ github.workspace }}/site
      BLOG_BOT_NAME: "lxndrJ[bot]"
      BLOG_BOT_EMAIL: "actions@github.com"

    steps:
      - name: Checkout pipeline repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout site repository (blog.pandango.de)
        uses: actions/checkout@v4
        with:
          repository: lxndrJ/blog.pandango.de
          token: ${{ secrets.BLOG_SYNC_TOKEN }}
          path: site
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate posts → publish to site → archive locally
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'daily' }}
          TOPIC: ${{ github.event.inputs.topic }}
          CATEGORY: ${{ github.event.inputs.category || 'Reise' }}
        run: |
          if [ "$MODE" = "daily" ] || [ -z "$TOPIC" ]; then
            # DAILY MODUS: 3 Posts (Reise, Kochen/Essen, Work-Life Balance)
            python orchestrator.py --daily --site-repo "$BLOG_SITE_REPO"
          else
            # SINGLE MODUS: 1 Post mit freiem Thema
            python orchestrator.py --topic "$TOPIC" --category "$CATEGORY" --site-repo "$BLOG_SITE_REPO"
          fi

      - name: Push pipeline repo (Archiv + Log)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "$BLOG_BOT_NAME"
          git config user.email "$BLOG_BOT_EMAIL"
          git add -A _posts archive run_log.jsonl history.json titles.json
          if git diff --cached --quiet; then
            echo "ℹ️ Pipeline-Repo ohne Änderungen"
          else
            git commit -m "Archive + Log: $(date +%F) (3 Posts veröffentlicht auf blog.pandango.de)"
            git pull --rebase origin main
            git push origin main
            echo "✅ Pipeline-Repo aktualisiert (Posts archiviert)"
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "## Blog Post Generation (Daily ×3)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kategorien | Reise · Kochen/Essen · Work-Life Balance |" >> $GITHUB_STEP_SUMMARY
          echo "| Flow | AI-Themengenerator → Recherche → Entwurf → Lektorat → Publish |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "archive" ]; then
            echo "| Archived posts | $(find archive -name '*.md' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          fi
          # Letzte 3 Einträge aus run_log
          if [ -f "run_log.jsonl" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Letzte Läufe" >> $GITHUB_STEP_SUMMARY
            tail -3 run_log.jsonl | python3 -c "
          import sys, json
          for line in sys.stdin:
              try:
                  d = json.loads(line)
                  print(f\"- **{d.get('category','?')}**: {d.get('title','?')} ({d.get('words',0)} Wörter)\")
              except: pass
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Blog Post Generation FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          exit 1
