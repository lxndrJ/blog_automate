name: Generate Blog Post (3×/Woche)

on:
  schedule:
    # Mo/Do/So um 08:00 Europe/Berlin
    - cron: "0 6 * * 1"
    - cron: "0 6 * * 4"
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      topic:
        description: "Freies Thema (optional)"
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then
            python orchestrator.py --topic "$TOPIC"
          else
            python orchestrator.py
          fi

      - name: Commit + Push (Direkt-Modus)
        if: ${{ vars.PR_FLOW != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "lxndrJ[bot]"
          git config user.email "actions@github.com"
          git add _posts run_log.jsonl history.json
          git diff --cached --quiet || git commit -m "Blog-Post: $(date +%F)"
          git push

      - name: PR erzeugen (Review-Modus)
        if: ${{ vars.PR_FLOW == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="post-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BR"
          git config user.name  "lxndrJ[bot]"
          git config user.email "actions@github.com"
          git add _posts run_log.jsonl history.json
          git commit -m "Blog-Post: $(date +%F)"
          git push --set-upstream origin "$BR"
          gh pr create --title "Neuer Blog-Post zum Review" --body "Automatisch generiert. Bitte Fakten & Quellen prüfen, dann mergen."
